# Daily incremental run: every parking citation the court CREATED since the last run, downloaded and OCR'd.
#
# Searching by the court's record-creation date (not the violation date) means a ticket entered late, even
# months after the violation, is picked up on the day it appears. Tickets whose document isn't listed yet
# stay "pending" and are retried for 30 days. The run's memory is state/daily_state.tsv, committed back to
# the repo after the results are safely uploaded (which also keeps this scheduled workflow from being
# disabled for inactivity). A failed or skipped run loses nothing: the next one starts from the same place.
#
# Output (pulled down by sync_results.ps1):
#   daily-db-YYYY-MM-DD-<run>      the run's SQLite database (gzipped)   kept 90 days
#   daily-images-YYYY-MM-DD-<run>  the run's ticket images               kept 30 days
name: daily

on:
  schedule:
    # 12:07 UTC = 4:07 AM Seattle standard time (5:07 AM in summer). The job then waits out the portal's
    # nightly slow period, which ends at 4:30. Off the hour because GitHub delays jobs scheduled on the hour.
    - cron: "7 12 * * *"
  workflow_dispatch:
    inputs:
      interval:
        description: "Seconds between API requests (0.3 = 3.3 per second)"
        default: "0.3"

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write   # to commit the state file
  actions: read

jobs:
  daily:
    runs-on: ubuntu-24.04   # pinned: the cached Tesseract packages below are built for this release
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/cache@v4
        with:
          path: ~/tesseract-debs
          key: tesseract-debs-${{ runner.os }}-noble-v1

      - name: Install Tesseract and Python packages
        run: |
          # cached packages first; if they don't fit this image (e.g. a new Ubuntu release), install normally
          if ls ~/tesseract-debs/*.deb >/dev/null 2>&1 && sudo dpkg -i ~/tesseract-debs/*.deb; then
            echo "installed Tesseract from the cache"
          else
            sudo dpkg -r tesseract-ocr >/dev/null 2>&1 || true
            rm -rf ~/tesseract-debs
            for attempt in 1 2 3 4 5; do
              sudo apt-get update -q -o Acquire::Retries=3 && \
              sudo apt-get install -y -q -o Acquire::Retries=5 --download-only tesseract-ocr && break
              echo "apt attempt $attempt failed; retrying in $((attempt * 60))s"; sleep $((attempt * 60))
            done
            mkdir -p ~/tesseract-debs && cp /var/cache/apt/archives/*.deb ~/tesseract-debs/
            sudo dpkg -i ~/tesseract-debs/*.deb
          fi
          tesseract --version | head -1
          pip install -q --retries 10 -r requirements.txt
          echo "DAY=$(TZ=America/Los_Angeles date +%F)" >> "$GITHUB_ENV"

      - name: Fetch and OCR new citations
        run: |
          start=$(date +%s)
          python -u parking_pipeline.py wait-maintenance --max-minutes 240
          python -u parking_pipeline.py --data-dir data --interval "${{ inputs.interval || '0.3' }}" \
            --stop-at $((start + 320 * 60)) daily --state state/daily_state.tsv --workers 12 --ocr-workers 4
          { echo "### daily run $DAY"; echo '```'; python parking_pipeline.py --data-dir data status; echo '```'
            echo "next window: $(head -1 state/daily_state.tsv)"; } | tee -a "$GITHUB_STEP_SUMMARY"
          gzip -k data/parking.db

      - name: Save the day's database
        uses: actions/upload-artifact@v4
        with:
          name: daily-db-${{ env.DAY }}-${{ github.run_id }}
          path: data/parking.db.gz
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - name: Save the day's ticket images
        uses: actions/upload-artifact@v4
        with:
          name: daily-images-${{ env.DAY }}-${{ github.run_id }}
          path: data/tickets
          retention-days: 30
          compression-level: 0
          if-no-files-found: ignore

      - name: Commit the state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/daily_state.tsv
          git diff --cached --quiet && exit 0
          git commit -q -m "daily state $DAY: $(head -1 state/daily_state.tsv | cut -f2)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 15; done
          exit 1
