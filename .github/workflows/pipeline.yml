# Runs the parking citation pipeline in ~5-hour chunks.
#
# The work is split by day into TOTAL_SHARDS shards (day ordinal % TOTAL_SHARDS). GitHub runs shards 0-2
# (shard 2 moved here from a local PC via the "seed" release); shard 3 runs on a Linux host
# (linux/run_shard.sh). Each shard keeps its own database, carried
# between GitHub runs as the "state-shard-K-of-N" artifact, and each shard job queues its own next run
# until its days are searched and its citations fetched. The schedule is only a backstop in case a chain
# breaks; per-shard concurrency keeps it to one job per shard. Shards never overlap; combine them at the
# end with `parking_pipeline.py merge`.
name: parking-pipeline

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "JSON list of shards to run, e.g. [0,1,2] or [1]"
        default: "[0,1,2]"
      interval:
        description: "Seconds between API requests per shard (0.2 = 5 per second)"
        default: "0.2"
      retry:
        description: "Also retry citations that errored or had no document"
        type: boolean
        default: false
  schedule:
    - cron: "23 */2 * * *"

permissions:
  actions: write   # read the previous run's state artifact and queue the next run
  contents: read

env:
  FROM: "2020-01-01"
  TO: "2026-10-31"
  TOTAL_SHARDS: "4"
  INTERVAL: ${{ inputs.interval || '0.2' }}
  DATA: data
  GH_TOKEN: ${{ github.token }}

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards || '[0,1,2]') }}
    concurrency:
      group: parking-shard-${{ matrix.shard }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      K: ${{ matrix.shard }}
      ARTIFACT: state-shard-${{ matrix.shard }}-of-4   # keep in step with TOTAL_SHARDS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tesseract and Python packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr
          pip install -q -r requirements.txt

      - name: Restore state from this shard's latest run
        id: restore
        run: |
          mkdir -p "$DATA"
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT&per_page=1" \
                   -q '.artifacts[] | select(.expired == false) | .workflow_run.id')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" -n "$ARTIFACT" -D "$DATA"
            gunzip -f "$DATA/parking.db.gz"
            echo "restored shard $K state from run $run_id ($(du -h "$DATA/parking.db" | cut -f1))"
          elif gh release download seed -R "$GITHUB_REPOSITORY" -p "parking-shard-$K-of-4.db.gz" -D "$DATA" 2>/dev/null; then
            # a shard moved here from another machine starts from the database it uploaded to the "seed" release
            mv "$DATA/parking-shard-$K-of-4.db.gz" "$DATA/parking.db.gz"
            gunzip -f "$DATA/parking.db.gz"
            echo "restored shard $K from the seed release ($(du -h "$DATA/parking.db" | cut -f1))"
          else
            echo "no previous state for shard $K; starting fresh"
          fi

      - name: Search, fetch + OCR, geocode
        continue-on-error: true   # whatever happens, save the progress made
        run: |
          start=$(date +%s)
          P="python -u parking_pipeline.py --data-dir $DATA --shard $K/$TOTAL_SHARDS --interval $INTERVAL"
          RETRY=${{ inputs.retry && '--retry' || '' }}
          $P --stop-at $((start + 260 * 60)) search --from "$FROM" --to "$TO"
          $P --stop-at $((start + 280 * 60)) fetch --ocr --ocr-workers 4 --delete-images all $RETRY
          $P --stop-at $((start + 300 * 60)) geocode

      - name: Status
        if: always() && steps.restore.outcome == 'success'
        run: |
          { echo "### shard $K of $TOTAL_SHARDS"; echo '```'
            python parking_pipeline.py --data-dir "$DATA" status; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compress state
        if: always() && steps.restore.outcome == 'success'
        run: gzip -kf "$DATA/parking.db" && ls -lh "$DATA"

      - name: Save state
        if: always() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: data/parking.db.gz
          retention-days: 3   # only the newest is used; short retention keeps old copies from piling up
          compression-level: 0
          if-no-files-found: error

      - name: Queue this shard's next run if work remains
        if: success()
        run: |
          left=$(python parking_pipeline.py --data-dir "$DATA" --shard "$K/$TOTAL_SHARDS" remaining --from "$FROM" --to "$TO")
          echo "shard $K work remaining: $left"
          if [ "$left" -gt 0 ]; then
            gh workflow run pipeline.yml --ref "$GITHUB_REF_NAME" -f shards="[$K]" -f interval="$INTERVAL"
          else
            echo "Shard $K is done. Run it once with retry=true, then remove it from the schedule."
          fi
